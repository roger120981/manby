[workspace]
members = [
    "crates/wagyu",
    "crates/tippecanoe-rs",
    "crates/tippecanoe-rs/crates/wagyu",
    "crates/tippecanoe-rs/crates/clipper2",
]

[package]
name = "manby"
version = "0.1.5"
edition = "2024"
description = "Builds vector tilesets from geographic features, like tippecanoe, several times faster"
license = "BSD-2-Clause"
rust-version = "1.89"
repository = "https://github.com/birkskyum/manby"
homepage = "https://birkskyum.github.io/manby/"
keywords = ["tippecanoe", "vector-tiles", "pmtiles", "mbtiles", "geojson"]
categories = ["science::geo", "command-line-utilities"]
include = ["/src/**", "/README.md", "/DESIGN.md", "/LICENSE.md"]

[dependencies]
# GeoParquet and Arrow input
arrow-array = "60.1"
arrow-buffer = "60.1"
arrow-ipc = { version = "60.1", default-features = false, features = ["lz4", "zstd"] }
arrow-schema = "60.1"
parquet = { version = "60.1", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "brotli", "flate2-zlib-rs"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
libc = "0.2.191"
libdeflater = "1.26.1"
memmap2 = "0.9.12"
mlt-core = { version = "0.22.0", optional = true }
tikv-jemallocator = "0.7"
rayon = "1.12.0"
rusqlite = { version = "0.41", features = ["bundled"] }
tippecanoe-rs = { version = "2.82.1", path = "crates/tippecanoe-rs" }
wagyu = { package = "manby-wagyu", version = "0.5.1", path = "crates/wagyu" }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
rustc-hash = "2.1"

[dev-dependencies]
libz-sys = "1.1"

[features]
# MapLibre Tile output (`--tile-format=mlt`). mlt-core needs Rust 1.98:
# cargo +1.98.1 build --release --features mlt
mlt = ["dep:mlt-core"]

[[example]]
name = "mlt_sizes"
required-features = ["mlt"]

[[example]]
name = "mlt_verify"
required-features = ["mlt"]

[[example]]
name = "mlt_reader_check"
required-features = ["mlt"]

[[example]]
name = "mlt_variants"
required-features = ["mlt"]

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
